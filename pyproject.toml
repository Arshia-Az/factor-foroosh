# Tool configuration only - this is an application, not a pip package.

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports/variables. Style is intentionally compact (see CONTRIBUTING.md).
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
