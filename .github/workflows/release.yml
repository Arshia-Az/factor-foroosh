name: Release

# Push a tag like v1.4.0 to build the Windows .exe and publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for Qt (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  windows-exe:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Check that the tag matches APP_VERSION
        shell: pwsh
        run: |
          $m = Select-String -Path app.py -Pattern 'APP_VERSION = "([^"]+)"'
          $version = $m.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match APP_VERSION $version in app.py"
            exit 1
          }

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --windowed --name FactorForoosh
          --icon assets/icon.ico --add-data "fonts;fonts" app.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/FactorForoosh -DestinationPath "FactorForoosh-${{ github.ref_name }}-windows.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FactorForoosh-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
